name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Build front
        run: npm run build

      - name: Tests
        run: php vendor/bin/phpunit

  anti-correlation:
    name: Invariant anti-corrélation (bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci
      - run: |
          cp .env.example .env
          php artisan key:generate
      - run: npm run build

      # Échoue si `system_id` fuit dans une réponse publique.
      - name: Anti-corrélation
        run: php vendor/bin/phpunit tests/Feature/AntiCorrelationTest.php
